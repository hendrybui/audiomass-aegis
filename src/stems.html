<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stem Separation - AudioMass</title>
    <link href="ico.png" rel="shortcut icon">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #e94560;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .upload-zone {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-zone:hover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .upload-zone.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.15);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: #e94560;
        }

        .upload-text {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .upload-subtext {
            font-size: 14px;
            color: #aaa;
        }

        #fileInput {
            display: none;
        }

        .stem-selector {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stem-selector h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .stem-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .stem-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .stem-option:hover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .stem-option.selected {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
        }

        .stem-option input {
            display: none;
        }

        .stem-option label {
            cursor: pointer;
            user-select: none;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #d63850;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .progress-container {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .progress-title {
            font-size: 18px;
            font-weight: 600;
        }

        .progress-cancel {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #eee;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #e94560, #0f3460);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-status {
            font-size: 14px;
            color: #aaa;
        }

        .results-container {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }

        .results-container.active {
            display: block;
        }

        .results-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .stem-list {
            display: grid;
            gap: 12px;
        }

        .stem-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stem-name {
            font-weight: 600;
        }

        .stem-actions {
            display: flex;
            gap: 8px;
        }

        .stem-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-download {
            background: #e94560;
            color: white;
        }

        .btn-download:hover {
            background: #d63850;
        }

        .btn-play {
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
        }

        .btn-play:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .error-message {
            display: none;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            color: #ff9999;
        }

        .error-message.active {
            display: block;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }

        .footer a {
            color: #e94560;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #e94560;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎵 Stem Separation</h1>
        <p>Separate audio into vocals, drums, bass, and other instruments using AI</p>
    </div>

    <div class="container">
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Drop your audio file here</div>
            <div class="upload-subtext">or click to browse (MP3, WAV, FLAC, OGG)</div>
            <input type="file" id="fileInput" accept="audio/*">
        </div>

        <div class="stem-selector">
            <h3>Select stems to extract:</h3>
            <div class="stem-options">
                <div class="stem-option selected" data-stem="vocals">
                    <input type="checkbox" id="stem_vocals" checked>
                    <label for="stem_vocals">🎤 Vocals</label>
                </div>
                <div class="stem-option selected" data-stem="drums">
                    <input type="checkbox" id="stem_drums" checked>
                    <label for="stem_drums">🥁 Drums</label>
                </div>
                <div class="stem-option selected" data-stem="bass">
                    <input type="checkbox" id="stem_bass" checked>
                    <label for="stem_bass">🎸 Bass</label>
                </div>
                <div class="stem-option" data-stem="guitar">
                    <input type="checkbox" id="stem_guitar">
                    <label for="stem_guitar">🎸 Guitar</label>
                </div>
                <div class="stem-option" data-stem="piano">
                    <input type="checkbox" id="stem_piano">
                    <label for="stem_piano">🎹 Piano</label>
                </div>
                <div class="stem-option selected" data-stem="other">
                    <input type="checkbox" id="stem_other" checked>
                    <label for="stem_other">🎵 Other</label>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="separateBtn" disabled>
                <span id="btnText">Separate Stems</span>
                <span class="loading-spinner" id="btnSpinner" style="display: none;"></span>
            </button>
            <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-header">
                <div class="progress-title">Processing Audio...</div>
                <button class="progress-cancel" id="cancelBtn">Cancel</button>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-status" id="progressStatus">Initializing...</div>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="results-header">🎉 Separation Complete!</div>
            <div class="stem-list" id="stemList"></div>
        </div>
    </div>

    <div class="footer">
        <a href="index.html?multitrack=1">← Back to AudioMass Editor</a>
    </div>

    <script>
        (function() {
            'use strict';

            const API_BASE = window.location.pathname.replace(/\/[^/]*$/, '') + '/api';

            let currentFile = null;
            let currentJobId = null;
            let eventSource = null;

            // DOM elements
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const separateBtn = document.getElementById('separateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressStatus = document.getElementById('progressStatus');
            const cancelBtn = document.getElementById('cancelBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const stemList = document.getElementById('stemList');
            const errorMessage = document.getElementById('errorMessage');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // File upload handling
            uploadZone.addEventListener('click', () => fileInput.click());

            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadZone.classList.add('dragover');
            });

            uploadZone.addEventListener('dragleave', () => {
                uploadZone.classList.remove('dragover');
            });

            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            // Stem selection handling
            document.querySelectorAll('.stem-option').forEach(option => {
                option.addEventListener('click', () => {
                    const checkbox = option.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                    option.classList.toggle('selected', checkbox.checked);
                });
            });

            function handleFile(file) {
                if (!file.type.startsWith('audio/')) {
                    showError('Please select an audio file');
                    return;
                }

                currentFile = file;
                uploadZone.innerHTML = `
                    <div class="upload-icon">✅</div>
                    <div class="upload-text">${file.name}</div>
                    <div class="upload-subtext">${(file.size / 1024 / 1024).toFixed(2)} MB • Click to change</div>
                `;
                separateBtn.disabled = false;
                hideError();
            }

            function getSelectedStems() {
                const selected = [];
                document.querySelectorAll('.stem-option input:checked').forEach(checkbox => {
                    selected.push(checkbox.id.replace('stem_', ''));
                });
                return selected;
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('active');
            }

            function hideError() {
                errorMessage.classList.remove('active');
            }

            async function startSeparation() {
                if (!currentFile) return;

                const selectedStems = getSelectedStems();
                if (selectedStems.length === 0) {
                    showError('Please select at least one stem');
                    return;
                }

                hideError();
                separateBtn.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'inline-block';
                progressContainer.classList.add('active');
                resultsContainer.classList.remove('active');

                try {
                    const formData = new FormData();
                    formData.append('file', currentFile);
                    formData.append('stems', JSON.stringify(selectedStems));

                    const response = await fetch(`${API_BASE}/jobs/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error('Upload failed: ' + response.status);
                    }

                    const data = await response.json();
                    currentJobId = data.job_id;

                    // Start SSE connection
                    startProgressStream();

                } catch (error) {
                    showError(error.message);
                    resetUI();
                }
            }

            function startProgressStream() {
                eventSource = new EventSource(`${API_BASE}/jobs/${currentJobId}/events`);

                eventSource.addEventListener('job_progress', (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        const progress = Math.round((data.progress || 0) * 100);
                        progressBar.style.width = progress + '%';

                        const stageNames = {
                            'validating_input': 'Validating audio...',
                            'ingesting_source': 'Loading audio...',
                            'transcoding': 'Converting format...',
                            'separating': 'Separating stems...',
                            'postprocessing': 'Post-processing...',
                            'analyzing': 'Analyzing audio...',
                            'packaging': 'Packaging results...'
                        };

                        progressStatus.textContent = stageNames[data.step] || data.message || 'Processing...';
                    } catch (err) {}
                });

                eventSource.addEventListener('job_done', () => {
                    closeSSE();
                    progressBar.style.width = '100%';
                    progressStatus.textContent = 'Complete!';
                    loadResults();
                });

                eventSource.addEventListener('job_failed', (e) => {
                    closeSSE();
                    try {
                        const data = JSON.parse(e.data);
                        showError(data.detail || 'Separation failed');
                    } catch (err) {
                        showError('Separation failed');
                    }
                    resetUI();
                });

                eventSource.addEventListener('job_cancelled', () => {
                    closeSSE();
                    showError('Separation was cancelled');
                    resetUI();
                });

                eventSource.onerror = () => {
                    closeSSE();
                    showError('Connection lost');
                    resetUI();
                };
            }

            function closeSSE() {
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
            }

            async function loadResults() {
                try {
                    const response = await fetch(`${API_BASE}/jobs/${currentJobId}/manifest`);
                    if (!response.ok) throw new Error('Failed to load results');

                    const manifest = await response.json();
                    const stemNames = manifest.available_stems || manifest.selected_stems || [];

                    stemList.innerHTML = '';
                    stemNames.forEach(stemName => {
                        const capitalized = stemName.charAt(0).toUpperCase() + stemName.slice(1);
                        const stemItem = document.createElement('div');
                        stemItem.className = 'stem-item';
                        stemItem.innerHTML = `
                            <div class="stem-name">${capitalized}</div>
                            <div class="stem-actions">
                                <button class="stem-btn btn-play" onclick="playStem('${stemName}')">▶ Play</button>
                                <button class="stem-btn btn-download" onclick="downloadStem('${stemName}')">⬇ Download</button>
                            </div>
                        `;
                        stemList.appendChild(stemItem);
                    });

                    progressContainer.classList.remove('active');
                    resultsContainer.classList.add('active');

                } catch (error) {
                    showError('Failed to load results: ' + error.message);
                    resetUI();
                }
            }

            window.playStem = async function(stemName) {
                const url = `${API_BASE}/jobs/${currentJobId}/stems/${stemName}?format=wav`;
                const audio = new Audio(url);
                audio.play();
            };

            window.downloadStem = async function(stemName) {
                const url = `${API_BASE}/jobs/${currentJobId}/stems/${stemName}?format=wav`;
                const response = await fetch(url);
                if (!response.ok) return;

                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${stemName}.wav`;
                link.click();
                URL.revokeObjectURL(link.href);
            };

            function cancelSeparation() {
                if (currentJobId) {
                    fetch(`${API_BASE}/jobs/${currentJobId}/cancel`, { method: 'POST' });
                }
                closeSSE();
                showError('Separation cancelled');
                resetUI();
            }

            function resetUI() {
                separateBtn.disabled = !currentFile;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
                progressContainer.classList.remove('active');
                progressBar.style.width = '0%';
                progressStatus.textContent = 'Initializing...';
            }

            function resetAll() {
                closeSSE();
                currentFile = null;
                currentJobId = null;
                fileInput.value = '';
                uploadZone.innerHTML = `
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">Drop your audio file here</div>
                    <div class="upload-subtext">or click to browse (MP3, WAV, FLAC, OGG)</div>
                `;
                separateBtn.disabled = true;
                hideError();
                resetUI();
                resultsContainer.classList.remove('active');
            }

            // Event listeners
            separateBtn.addEventListener('click', startSeparation);
            resetBtn.addEventListener('click', resetAll);
            cancelBtn.addEventListener('click', cancelSeparation);

        })();
    </script>
</body>
</html>
